[workspace]
# Virtual manifests carry no edition, so the resolver must be explicit.
# "3" is the edition-2024 default.
resolver = "3"
members = [
    "crates/thread-dtls",
    "crates/ot-commissioner-rs",
    "crates/ot-commissioner-cli",
    "crates/ot-netdiag",
]
# The cargo-fuzz crate is nightly-only and keeps its own workspace so it never
# joins the stable build graph.
exclude = ["fuzz", "demo/esp32h2-dtls"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
thread-dtls = { path = "crates/thread-dtls", version = "0.1.0" }
ot-commissioner-rs = { path = "crates/ot-commissioner-rs", version = "0.1.0" }
# RustCrypto symmetric/hash/RNG stack. These are intentionally held one major
# behind their newest releases (aes 0.9, cmac 0.8, hmac 0.13, sha2 0.11,
# rand_core 0.10): those are the new RustCrypto generation built on
# `digest 0.11` / `cipher 0.5` / the reworked `rand_core` traits, which cannot
# interoperate with the only *stable* releases of `p256` (0.13.2) and `ccm`
# (0.5.0) that this workspace also depends on. Moving them requires p256 0.14
# (currently only release candidates). Bump these together with p256 once its
# new generation ships stable.
aes = { version = "0.8.4", default-features = false }
ccm = { version = "0.5.0", default-features = false, features = ["alloc"] }
cmac = "0.7.2"
hmac = { version = "0.12", default-features = false }
p256 = { version = "0.13.2", default-features = false, features = ["arithmetic"] }
rand_core = { version = "0.6", default-features = false }
sha2 = { version = "0.10", default-features = false }
# Latest-stable, no generation coupling.
argh = "0.1.19"
hex = "0.4.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
subtle = { version = "2.6.1", default-features = false }
thiserror = { version = "2.0.18", default-features = false }
tokio = { version = "1.52.3", features = ["net", "time", "macros", "rt-multi-thread"] }
zeroize = { version = "1.9.0", default-features = false, features = ["alloc", "derive"] }
