[package]
name = "ot-commissioner-rs"
description = "Rust foundations for OpenThread commissioner sessions over MeshCoP"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = []
# Deterministic scripted MeshCoP transport (`commissioner::harness`) and the
# scripted-connect hooks on `Commissioner`, for driving the public API in
# tests. Unstable test scaffolding for this workspace's suites; not a
# supported public API.
test-support = []

[dependencies]
thread-dtls.workspace = true
aes.workspace = true
cmac.workspace = true
hex.workspace = true
rand_core = { workspace = true, features = ["getrandom"] }
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
zeroize.workspace = true

[dev-dependencies]
thread-dtls = { workspace = true, features = ["test-support"] }
argh.workspace = true
serde.workspace = true
serde_json.workspace = true
# test-util enables tokio::test(start_paused) so event-pump deadlines elapse
# instantly in deterministic CLI tests; process/io-util let the interop test
# drive a simulated OpenThread joiner CLI as a child process.
tokio = { workspace = true, features = ["test-util", "process", "io-util"] }
