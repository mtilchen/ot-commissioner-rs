[package]
name = "ot-commissioner-rs"
description = "Rust foundations for OpenThread commissioner sessions over MeshCoP"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = []
# The `ot-commissioner-rs` REPL binary, a faithful reimplementation of the C++
# `ot-commissioner` CLI. Off by default so the library's dependency surface stays
# minimal; build/run with `--features cli`.
cli = ["dep:serde", "dep:serde_json"]
# Deterministic scripted MeshCoP transport (`commissioner::harness`) and the
# scripted-connect hooks on `Commissioner`, for driving the public API in
# tests. Unstable test scaffolding for this workspace's suites; not a
# supported public API.
test-support = []

[dependencies]
thread-dtls.workspace = true
aes.workspace = true
cmac.workspace = true
hex.workspace = true
rand_core.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
zeroize.workspace = true
# CLI-only, pulled in solely by the `cli` feature.
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

[dev-dependencies]
thread-dtls = { workspace = true, features = ["test-support"] }
argh.workspace = true
serde.workspace = true
serde_json.workspace = true
# test-util enables tokio::test(start_paused) so event-pump deadlines elapse
# instantly in deterministic CLI tests; process/io-util let the interop test
# drive a simulated OpenThread joiner CLI as a child process.
tokio = { workspace = true, features = ["test-util", "process", "io-util"] }

[[bin]]
name = "ot-commissioner-rs"
path = "src/main.rs"
required-features = ["cli"]
